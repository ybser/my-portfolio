  <!-- Navigation -->

      <a href="index.html" class="nav-logo">姚宝升</a>
      <button class="nav-toggle" aria-label="菜单">

  </nav>

  <!-- Page Header -->
  <header class="page-header">
    <div class="container">
      <span class="hero-greeting">联系方式</span>

      <p class="page-subtitle">无论是合作咨询还是项目讨论，欢迎随时与我取得联系</p>

  <main>
    <section class="section">
      <div class="container">
        <div class="contact-wrapper">
          <!-- 左侧：替代原来表单的内容 -->
          <div class="contact-info" style="grid-column: 1 / -1; text-align: center; padding: 2rem 0;">
            <p style="font-size: 1.2rem; color: #333; max-width: 600px; margin: 0 auto;">
              📧 邮箱：<a href="mailto:2058448113@qq.com" style="color: #2563eb; text-decoration: none; font-weight: 500;">2058448113@qq.com</a>

            <p style="font-size: 1.1rem; color: #555; margin-top: 0.8rem;">
              📍 河北承德
            </p>
            <p style="font-size: 1rem; color: #888; margin-top: 1.5rem; border-top: 1px solid #eaeaea; padding-top: 1.5rem; max-width: 500px; margin-left: auto; margin-right: auto;">
              💬 如有合作或工作机会，欢迎随时邮件联系。<br>

  <script>
    // Mobile menu toggle（保留）
    const toggle = document.querySelector('.nav-toggle');
    const menu = document.querySelector('.nav-menu');
    toggle.addEventListener('click', () => {
      toggle.classList.toggle('active');
      menu.classList.toggle('active');
    });
    // Close menu on link click (mobile)
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        toggle.classList.remove('active');
        menu.classList.remove('active');
      });
    });
    // 注意：原表单提交的 JS 已全部移除
  </script>
